<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语录管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #1a1a1a;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: #252526;
            border-bottom: 1px solid #3a3a3a;
        }
        .header h1 { margin: 0; font-size: 20px; font-weight: 500; }
        .header a { color: #75bfff; text-decoration: none; }
        .container { max-width: 1080px; margin: 0 auto; padding: 24px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            background: #303033;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px 16px;
        }
        .tab.active { color: white; background: #176ba0; border-color: #2384c6; }
        .summary { color: #888; margin-bottom: 18px; }
        .review-list { display: grid; gap: 14px; }
        .card {
            background: #252526;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 16px 18px;
        }
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            color: #888;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .name { color: #75bfff; font-size: 15px; font-weight: 600; }
        .status {
            border-radius: 10px;
            padding: 1px 8px;
            font-weight: 600;
        }
        .status-pending { color: #e3b75f; background: #473b25; }
        .status-approved { color: #6fd397; background: #244333; }
        .status-rejected { color: #eb8585; background: #4b2929; }
        .content {
            color: #eee;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-bottom: 14px;
        }
        .image-wrap { margin-bottom: 14px; }
        .image-wrap img {
            display: block;
            max-width: min(100%, 560px);
            max-height: 520px;
            object-fit: contain;
            border-radius: 6px;
            background: #181818;
        }
        .actions { display: flex; gap: 10px; justify-content: flex-end; }
        button {
            border: 0;
            border-radius: 4px;
            padding: 7px 18px;
            color: white;
            cursor: pointer;
        }
        button:disabled { opacity: .45; cursor: wait; }
        .approve { background: #2d8a52; }
        .reject { background: #b04444; }
        .pending { background: #9a742c; }
        .delete { background: #6b3540; }
        .empty {
            padding: 70px 20px;
            text-align: center;
            color: #777;
            border: 1px dashed #444;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .header { padding: 12px 16px; }
            .container { padding: 16px; }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>语录管理</h1>
        <a href="{{ url_for('index') }}">返回控制台</a>
    </div>
    <main class="container">
        <div class="tabs">
            <button class="tab active" data-filter="pending" onclick="setFilter('pending', this)">待审核</button>
            <button class="tab" data-filter="all" onclick="setFilter('all', this)">全部语录</button>
        </div>
        <div class="summary" id="summary"></div>
        <div id="review-list" class="review-list">
            {% for item in memes %}
            <article class="card" id="meme-{{ item.id }}" data-status="{{ item.status }}">
                <div class="meta">
                    <span class="name">{{ item.name }}</span>
                    <span class="status status-{{ item.status }}"></span>
                    <span>提交者 QQ：{{ item.adder_uid }}</span>
                    <span>{{ item.created_at }}</span>
                    <span>#{{ item.id }}</span>
                </div>
                {% if item.entry_type == 'image' %}
                <div class="image-wrap">
                    <img src="{{ url_for('meme_image', record_id=item.id) }}" loading="lazy" alt="{{ item.name }}图片">
                </div>
                {% else %}
                <div class="content">{{ item.content }}</div>
                {% endif %}
                <div class="actions"></div>
            </article>
            {% endfor %}
        </div>
        <div id="empty-state" class="empty" style="display:none"></div>
    </main>

    <script>
        const csrfToken = {{ csrf_token|tojson }};
        const statusLabels = {
            pending: '待审核',
            approved: '已通过',
            rejected: '已拒绝',
        };
        let currentFilter = 'pending';

        function renderActions(card) {
            const id = Number(card.id.replace('meme-', ''));
            const status = card.dataset.status;
            const actions = card.querySelector('.actions');
            const buttons = [];
            if (status !== 'pending') {
                buttons.push(`<button class="pending" onclick="reviewMeme(${id}, 'pending')">撤回待审</button>`);
            }
            if (status !== 'rejected') {
                buttons.push(`<button class="reject" onclick="reviewMeme(${id}, 'rejected')">拒绝</button>`);
            }
            if (status !== 'approved') {
                buttons.push(`<button class="approve" onclick="reviewMeme(${id}, 'approved')">通过</button>`);
            }
            buttons.push(`<button class="delete" onclick="reviewMeme(${id}, 'deleted')">彻底删除</button>`);
            actions.innerHTML = buttons.join('');

            const badge = card.querySelector('.status');
            badge.className = `status status-${status}`;
            badge.textContent = statusLabels[status];
        }

        function refreshView() {
            const cards = [...document.querySelectorAll('.card')];
            let visible = 0;
            let pending = 0;
            cards.forEach(card => {
                if (card.dataset.status === 'pending') pending++;
                const show = currentFilter === 'all' || card.dataset.status === currentFilter;
                card.style.display = show ? 'block' : 'none';
                if (show) visible++;
            });
            document.getElementById('summary').textContent = currentFilter === 'pending'
                ? `共 ${pending} 条待审核语录`
                : `共 ${cards.length} 条语录，其中 ${pending} 条待审核`;
            const empty = document.getElementById('empty-state');
            empty.textContent = currentFilter === 'pending' ? '暂无待审核语录' : '暂无语录';
            empty.style.display = visible === 0 ? 'block' : 'none';
        }

        function setFilter(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
            button.classList.add('active');
            refreshView();
        }

        async function reviewMeme(id, action) {
            const card = document.getElementById(`meme-${id}`);
            if (action === 'deleted' && !confirm('确定要彻底删除这条语录吗？此操作不可恢复。')) {
                return;
            }
            const buttons = card.querySelectorAll('button');
            buttons.forEach(item => item.disabled = true);
            try {
                const response = await fetch(`/api/meme-review/${id}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                    },
                    body: JSON.stringify({ action }),
                });
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.msg || '审核失败');
                }
                if (data.status === 'deleted') {
                    card.remove();
                } else {
                    card.dataset.status = data.status;
                    renderActions(card);
                }
                refreshView();
            } catch (error) {
                alert(error.message || '审核失败');
                buttons.forEach(item => item.disabled = false);
            }
        }

        document.querySelectorAll('.card').forEach(renderActions);
        refreshView();
    </script>
</body>

</html>
